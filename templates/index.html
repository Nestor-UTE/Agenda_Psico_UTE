<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión | Agenda Psico UTE</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
  <link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>
  <main class="pantalla">

    <!-- Lado izquierdo: logo y eslogan -->
    <section class="lado-marca">
      <img class="logo" src="{{ url_for('static', filename='img/logo2.png') }}" alt="Logo Agenda Psico UTE">
      <p class="eslogan">Tu espacio, tu proceso, tu tiempo</p>
    </section>

    <!-- Lado derecho: tarjeta de login -->
    <section class="tarjeta">
      <h1>Iniciar sesión</h1>

      <form action="/login" method="post">

        <div class="roles">
          <input type="radio" name="rol" id="rol-tutor" value="tutor" checked>
          <label for="rol-tutor">Tutor</label>

          <input type="radio" name="rol" id="rol-psicologa" value="psicologa">
          <label for="rol-psicologa">Psicóloga</label>
        </div>

        <div class="campo">
          <i class="bi bi-person"></i>
          <input type="text" name="usuario" placeholder="Correo o usuario" required>
        </div>

        <div class="campo">
          <i class="bi bi-lock"></i>
          <input type="password" name="password" id="password" placeholder="Contraseña" required>
          <button type="button" class="ojo" id="btn-ojo">
            <i class="bi bi-eye-slash"></i>
          </button>
        </div>

        <button type="submit" class="btn-entrar">Entrar</button>
      </form>

      <!-- Acceso del alumno -->
      <div class="separador"><span>o</span></div>

      <form action="/folio" method="post" class="folio-box">
        <p>¿Eres alumno? ¿Quieres revisar tu progreso? Escribe tu folio aquí</p>
        <div class="folio-campo">
          <input type="text" name="folio" placeholder="Folio" required>
          <button type="submit">Consultar</button>
        </div>
      </form>
    </section>

  </main>

  <script>
    const campoPassword = document.getElementById("password");
    const botonOjo = document.getElementById("btn-ojo");
    const iconoOjo = botonOjo.querySelector("i");

    botonOjo.addEventListener("click", function () {
      if (campoPassword.type === "password") {
        campoPassword.type = "text";
        iconoOjo.className = "bi bi-eye";
      } else {
        campoPassword.type = "password";
        iconoOjo.className = "bi bi-eye-slash";
      }
    });
  </script>
</body>
</html>
