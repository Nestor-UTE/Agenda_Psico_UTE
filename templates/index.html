<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión | Agenda Psico UTE</title>
  <link rel="stylesheet" href="static/css/login.css">
  <link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>


<body>

  <main class="pantalla">

    <div class="marca">
        <img src="static/css/js/img/logo2_blanco.png" alt="" width="200px" height="150px">
    </div>

    <section class="tarjeta">
      <h1>Iniciar sesión</h1>

      <form action="/login" method="post">

        <div class="roles">
          <input type="radio" name="rol" id="rol-tutor" value="tutor" checked>
          <label for="rol-tutor">Tutor</label>

          <input type="radio" name="rol" id="rol-psicologa" value="psicologa">
          <label for="rol-psicologa">Psicóloga</label>
          
        </div>

        <div class="campo">
          <i class="bi bi-person"></i>
          <input type="text" name="usuario" placeholder="Correo o usuario">
        </div>

        <div class="campo">
          <i class="bi bi-lock"></i>
          <input type="password" name="password" id="password" placeholder="Contraseña">
          <button type="button" class="ojo" id="btn-ojo">
          <i class="bi bi-eye-slash"></i>
          </button>
          </div>

        <button type="submit" class="btn-entrar">Entrar</button>
      </form>
        <form action="/folio" method="post" class="folio-box">
        <p>¿Eres alumno? ¿Quieres revisar tu progreso? Escríbelo aquí</p>
        <input type="text" name="folio" placeholder="folio">
        </form>
    </section>

  </main>
    <script>
    const campoPassword = document.getElementById("password");
    const botonOjo = document.getElementById("btn-ojo");
    const iconoOjo = botonOjo.querySelector("i");

    botonOjo.addEventListener("click", function () {
      if (campoPassword.type === "password") {
        campoPassword.type = "text";
        iconoOjo.className = "bi bi-eye";
      } else {
        campoPassword.type = "password";
        iconoOjo.className = "bi bi-eye-slash";
      }
    });
  </script>
</body>
</html>
